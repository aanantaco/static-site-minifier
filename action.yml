name: 'Static Site Minifier'
description: >-
  Minify a static site (HTML, CSS, JS) using a prebuilt
  static-site-minifier binary downloaded from GitHub releases.
author: 'aanantaco'
branding:
  icon: 'minimize-2'
  color: 'blue'

inputs:
  version:
    description: >-
      Release tag to download (for example v1.0.24-41d39ae). Leave it as
      "latest" to run the release built from the same commit as this action:
      the ref the action is pinned to (a release tag, a commit SHA, the v1 tag
      or a branch) is mapped to its release, so pinning the action pins the
      binary. A ref with no release falls back to the pinned default release.
      Every download is verified against the release's checksums.txt and
      refused if it cannot be; releases published before checksums.txt existed
      cannot be used.
    required: false
    default: 'latest'
  src:
    description: 'Source directory to minify.'
    required: false
    default: 'src'
  dest:
    description: 'Destination directory for the minified site.'
    required: false
    default: 'dist'

outputs:
  version:
    description: >-
      The release tag the binary was downloaded from, or "source" when the
      action was run from its own checkout (uses: ./) and built the binary.
    value: ${{ steps.download.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Download builder binary
      id: download
      shell: bash
      env:
        SSM_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        set -euo pipefail

        repo="aanantaco/static-site-minifier"
        repo_url="https://github.com/${repo}"
        # Used when the pinned ref cannot be mapped to a release. Bump it to
        # the newest release that ships checksums.txt.
        default_version="v1.0.24-41d39ae"

        case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=darwin ;;
          MINGW*|MSYS*|CYGWIN*) os=windows ;;
          *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          armv7l|armv6l|arm) arch=arm ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        asset="builder-${os}-${arch}"
        if [ "$os" = "windows" ]; then asset="${asset}.exe"; fi
        archive="${asset}.tar.gz"

        dir="${RUNNER_TEMP}/static-site-minifier"
        mkdir -p "$dir"
        bin="$dir/builder"
        if [ "$os" = "windows" ]; then bin="${bin}.exe"; fi
        echo "bin=${bin}" >> "$GITHUB_OUTPUT"

        # Which release to run.
        #   version input set      -> that tag, verbatim
        #   uses: ./ (this repo)   -> no release exists for an unmerged commit;
        #                             build the checkout itself (next steps)
        #   release tag ref        -> that tag
        #   SHA / v1 / branch ref  -> the commit it names, then the release tag
        #                             ending in that commit's short SHA
        #   anything else          -> default_version
        tag=""
        if [ -n "$SSM_VERSION" ] && [ "$SSM_VERSION" != "latest" ]; then
          tag="$SSM_VERSION"
        else
          ref="${ACTION_REF:-}"
          if [ -z "$ref" ] || [ -z "${ACTION_REPOSITORY:-}" ]; then
            echo "Action run from its own checkout; building builder from source." >&2
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "version=source" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$ ]]; then
            tag="$ref"
          else
            sha=""
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              sha="$ref"
            elif command -v git >/dev/null 2>&1; then
              refs="$(git ls-remote "$repo_url" "refs/tags/${ref}^{}" "refs/tags/${ref}" "refs/heads/${ref}" 2>/dev/null || true)"
              # Prefer the peeled commit of an annotated tag.
              sha="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
              if [ -z "$sha" ]; then
                sha="$(printf '%s\n' "$refs" | awk 'NF { print $1; exit }')"
              fi
            fi
            if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && command -v git >/dev/null 2>&1; then
              short="${sha:0:7}"
              tag="$(git ls-remote --tags "$repo_url" "refs/tags/v*-${short}" 2>/dev/null \
                | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' \
                | sort -V | tail -n 1 || true)"
            fi
            if [ -z "$tag" ]; then
              echo "Action ref '${ref}' has no matching release; using ${default_version}." >&2
              tag="$default_version"
            fi
          fi
        fi

        if ! [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
          echo "invalid release tag: ${tag}" >&2
          exit 1
        fi

        base="${repo_url}/releases/download/${tag}"
        echo "Resolved release: ${tag}"
        echo "version=${tag}" >> "$GITHUB_OUTPUT"

        echo "Downloading ${base}/${archive}"
        curl -fsSL --retry 3 --retry-delay 2 -o "$dir/${archive}" "${base}/${archive}"

        # Verify against the release's checksums.txt. Every arm is fatal: a
        # missing checksums file, a missing asset line, no sha256 tool or a
        # mismatch stops the job instead of running an unverified binary.
        if ! curl -fsSL --retry 3 --retry-delay 2 -o "$dir/checksums.txt" "${base}/checksums.txt"; then
          echo "::error::Release ${tag} has no checksums.txt; refusing to run an unverified binary." >&2
          exit 1
        fi
        line="$(grep " ${archive}\$" "$dir/checksums.txt" || true)"
        if [ -z "$line" ]; then
          echo "::error::${archive} is not listed in checksums.txt for release ${tag}." >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ( cd "$dir" && printf '%s\n' "$line" | sha256sum -c - )
        elif command -v shasum >/dev/null 2>&1; then
          ( cd "$dir" && printf '%s\n' "$line" | shasum -a 256 -c - )
        else
          echo "::error::Neither sha256sum nor shasum is available; cannot verify ${archive}." >&2
          exit 1
        fi

        tar -xzf "$dir/${archive}" -C "$dir"
        mv "$dir/${asset}" "$bin"
        chmod +x "$bin"
        "$bin" version
        echo "resolved=true" >> "$GITHUB_OUTPUT"

    - name: Set up Go (build from source)
      if: steps.download.outputs.resolved != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Build builder (build from source)
      if: steps.download.outputs.resolved != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        SSM_BIN: ${{ steps.download.outputs.bin }}
      run: |
        set -euo pipefail
        CGO_ENABLED=0 go build -buildvcs=false -o "$SSM_BIN" ./cmd/builder
        "$SSM_BIN" version

    - name: Minify site
      shell: bash
      env:
        SSM_BIN: ${{ steps.download.outputs.bin }}
        SRC_DIR: ${{ inputs.src }}
        DEST_DIR: ${{ inputs.dest }}
      run: '"$SSM_BIN" build'
