name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per ref. Pull-request runs are superseded by newer pushes; the
# release run on main is never cancelled mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run golangci-lint
        run: make lint

      - name: Run markdownlint
        run: make markdown-lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: make test-cover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/coverage.out
          fail_ci_if_error: false

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install reporters
        # Pinned for reproducibility (same pair as aanantaco/coverage's CI).
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          go install github.com/boumenot/gocover-cobertura@v1.5.0

      - name: Run tests with coverage
        run: |
          mkdir -p cov
          gotestsum --junitfile cov/tests-builder.xml --format pkgname \
            -- -coverprofile=coverage.out -covermode=atomic ./...
          gocover-cobertura < coverage.out > cov/coverage-builder.xml

      - name: Aggregate coverage summary
        # Pinned to reviewed commit SHA per upstream guidance; bump after review.
        uses: aanantaco/coverage@ab3d55e91fd6563135cad00e2335520c8e0360cf
        with:
          input: ./cov
          output: $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: cov/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run govulncheck
        # Pinned to the release @latest resolved to when this was written; the
        # vulnerability database is still fetched fresh on every run.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: ./...

  action-test:
    name: Action Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Minify the example site with the action
        id: minify
        uses: ./
        with:
          src: test/src
          dest: action-out

      - name: Verify minified output
        env:
          ACTION_VERSION: ${{ steps.minify.outputs.version }}
        run: |
          echo "action resolved release: ${ACTION_VERSION}"
          test -n "${ACTION_VERSION}"
          test -s action-out/index.html
          test -s action-out/css/app.css
          test -s action-out/img/bg-unsplash.jpg
          grep -q "minified at" action-out/index.html

  # ==========================================================================
  # GitHub Actions security scan (zizmor)
  # ==========================================================================
  # Audits the workflows and action.yml for template injection, unpinned
  # actions, credential persistence, cache poisoning, and so on. Runs with
  # GITHUB_TOKEN so the online audits (known-vulnerable-actions,
  # impostor-commit, stale-action-refs) run too. Suppressions go in
  # .github/zizmor.yml with a justification. https://docs.zizmor.sh/audits/
  actions-scan:
    name: Security Scan (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor + render report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # :latest on purpose: the audit catalogue and the action-vulnerability
        # data behind it move faster than we would re-pin a digest, and the
        # image only reads the checkout (no secrets beyond the read-only
        # GITHUB_TOKEN). Pin a digest if that changes.
        run: |
          mkdir -p zizmor-report
          zizmor() {
            docker run --rm \
              -e GH_TOKEN \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              ghcr.io/zizmorcore/zizmor:latest \
              --no-progress --color=never --strict-collection "$@"
          }
          # Inline PR annotations (best effort: GitHub renders at most 10 per
          # step). The exit code comes from the full report below.
          zizmor --format github --no-exit-codes . || true
          set +e
          zizmor --format plain . > zizmor-report/zizmor-report.txt
          zizmor_exit=$?
          set -e
          cat zizmor-report/zizmor-report.txt
          {
            echo "## zizmor (GitHub Actions security scan)"
            echo ""
            echo '```'
            cat zizmor-report/zizmor-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = clean; 11-14 = findings (highest severity informational..high);
          # anything else = zizmor itself failed. All non-zero fail the job.
          exit "$zizmor_exit"

      - name: Upload zizmor report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-report
          path: zizmor-report/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, test, coverage-report, security, action-test, actions-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release binaries
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-binaries
          path: bin/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials stay: the last step pushes the moving v1 tag with git
        # (suppressed in .github/zizmor.yml).

      - name: Generate version
        id: version
        run: |
          VERSION=$(cat VERSION.txt)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          FULL_VERSION="v${VERSION}.${{ github.run_number }}-${SHORT_SHA}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: builder-binaries
          path: bin/

      - name: Create release archives
        # checksums.txt (sha256sum format) ships with the archives; action.yml
        # refuses to run a binary it cannot verify against it.
        run: |
          cd bin
          for file in builder-*; do
            if [[ -f "$file" ]]; then
              chmod +x "$file"
              tar -czvf "${file}.tar.gz" "$file"
            fi
          done
          sha256sum builder-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            bin/*.tar.gz
            bin/checksums.txt

      # Keep the v1 major tag on the latest release so workflows using
      # aanantaco/static-site-minifier@v1 always get the newest action.
      # The Marketplace listing follows new releases automatically once
      # the action has been published there (a one-time step in the
      # release UI).
      - name: Update the v1 major tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 "${{ github.sha }}"
          git push origin v1 --force
